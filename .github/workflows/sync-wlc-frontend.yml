name: Sync WLC frontend

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wlc-frontend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out wlls
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out White Language
        uses: actions/checkout@v6
        with:
          repository: pangbai520/White-Language
          ref: main
          path: upstream
          fetch-depth: 0
          persist-credentials: false

      - name: Check for frontend changes
        id: frontend
        shell: bash
        run: |
          set -euo pipefail

          revision_file="vendor/wlc-frontend/REVISION"
          recorded="$(sed -n 's/^commit=//p' "$revision_file" | tr -d '\r')"
          latest="$(git -C upstream rev-parse HEAD)"
          files=(
            src/core/WhitelangExceptions.wl
            src/core/WhitelangLexer.wl
            src/core/WhitelangNodes.wl
            src/core/WhitelangParser.wl
            src/core/WhitelangTokens.wl
          )

          if [[ ! "$recorded" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=$revision_file::Invalid recorded commit: $recorded"
            exit 1
          fi
          if ! git -C upstream cat-file -e "${recorded}^{commit}"; then
            echo "::error file=$revision_file::Recorded commit is not present in White-Language history: $recorded"
            exit 1
          fi
          for file in "${files[@]}"; do
            if [[ ! -f "upstream/$file" ]]; then
              echo "::error::Missing upstream frontend source: $file"
              exit 1
            fi
          done

          if [[ "$recorded" == "$latest" ]] || git -C upstream diff --quiet "$recorded" "$latest" -- "${files[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${files[@]}"; do
            cp "upstream/$file" "vendor/wlc-frontend/$(basename "$file")"
          done
          printf 'repository=https://github.com/whitelanguage/white\ncommit=%s\n' "$latest" > "$revision_file"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$latest" >> "$GITHUB_OUTPUT"

      - name: Commit synchronized frontend
        if: steps.frontend.outputs.changed == 'true'
        shell: bash
        env:
          REVISION: ${{ steps.frontend.outputs.revision }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/wlc-frontend
          git commit -m "chore(frontend): sync White Language at ${REVISION:0:12}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
